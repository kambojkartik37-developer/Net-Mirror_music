name: NetMirror Music Android TV APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "core/**"
      - "playback/**"
      - "audio-dsp/**"
      - "dsp-core/**"
      - "usbaudio/**"
      - "innertube/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradlew"
      - ".github/workflows/android-tv-build.yml"

permissions:
  contents: read

concurrency:
  group: netmirror-tv-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-tv-apk:
    name: Build Android TV ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Locate runner Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK directory not found: $SDK_ROOT"
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found in the runner's installed Android SDK"
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "Using SDK manager: $SDKMANAGER"

      - name: Install required SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          # Several project libraries require compileSdk 37. Request the preview channel
          # explicitly so sdkmanager can see the Android 37 platform package.
          "$SDKMANAGER" --channel=3 --install "platform-tools" "platforms;android-37" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Validate TV source and prepare signing
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f gradle/wrapper/gradle-wrapper.jar
          grep -q 'android.intent.category.LEANBACK_LAUNCHER' app/src/main/AndroidManifest.xml
          grep -q 'android:name=".MainActivity"' app/src/main/AndroidManifest.xml
          chmod +x ./gradlew
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          java -version
          ./gradlew --no-daemon --version

      - name: Build TV ARM64 FOSS debug APK
        shell: bash
        run: |
          set -uo pipefail
          set +e
          ./gradlew --no-daemon --max-workers=2 --console=plain --stacktrace --warning-mode all :app:assembleArm64FossDebug 2>&1 | tee "$RUNNER_TEMP/tv-build.log"
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ]; then
            echo "::group::Build error summary"
            grep -n -E -i 'What went wrong|Execution failed for task|^e: | error:|Could not resolve|Could not find|Unresolved reference|Compilation error|requires libraries|Caused by:|BUILD FAILED|SDK location not found' "$RUNNER_TEMP/tv-build.log" | tail -n 100 || true
            echo "::endgroup::"
            echo "::group::Last 180 build log lines"
            tail -n 180 "$RUNNER_TEMP/tv-build.log"
            echo "::endgroup::"
            exit "$result"
          fi

      - name: Verify and stage TV APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -type f -name '*.apk' -print | grep -i 'arm64' | grep -i 'foss' | grep -i 'debug' | head -n 1 || true)"
          if [ -z "$APK" ]; then
            echo "::error::Build succeeded but ARM64 FOSS debug APK was not found"
            find app/build/outputs -maxdepth 7 -type f 2>/dev/null || true
            exit 1
          fi
          mkdir -p publish
          cp "$APK" publish/Net-Mirror-Music-android-tv-ARM64-debug.apk
          test -s publish/Net-Mirror-Music-android-tv-ARM64-debug.apk
          sha256sum publish/Net-Mirror-Music-android-tv-ARM64-debug.apk
          ls -lh publish/

      - name: Upload Android TV APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetMirror-Music-android-tv-ARM64-debug
          path: publish/Net-Mirror-Music-android-tv-ARM64-debug.apk
          if-no-files-found: error
          retention-days: 30
