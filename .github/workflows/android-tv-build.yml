name: NetMirror Music Android TV APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "core/**"
      - "playback/**"
      - "audio-dsp/**"
      - "dsp-core/**"
      - "usbaudio/**"
      - "innertube/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradlew"
      - ".github/workflows/android-tv-build.yml"

permissions:
  contents: read

concurrency:
  group: netmirror-tv-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-tv-apk:
    name: Build, verify and upload TV APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Validate project and prepare debug signing
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts || { echo "::error::settings.gradle.kts is missing at repository root"; exit 1; }
          test -f app/build.gradle.kts || { echo "::error::app/build.gradle.kts is missing at repository root"; exit 1; }
          test -f gradle/wrapper/gradle-wrapper.jar || { echo "::error::Gradle wrapper JAR is missing"; exit 1; }
          chmod +x gradlew
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          ./gradlew --no-daemon --version

      - name: Build Universal FOSS Debug APK
        shell: bash
        run: |
          set -uo pipefail
          set +e
          ./gradlew --no-daemon --console=plain --stacktrace --warning-mode all :app:assembleUniversalFossDebug 2>&1 | tee "$RUNNER_TEMP/tv-build.log"
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ]; then
            echo "::group::Gradle error summary"
            grep -n -E -i 'What went wrong|Execution failed for task|^e: | error:|Could not resolve|Could not find|Unresolved reference|Compilation error|Caused by:|BUILD FAILED' "$RUNNER_TEMP/tv-build.log" | tail -n 100 || true
            echo "::endgroup::"
            echo "::group::Last 160 build log lines"
            tail -n 160 "$RUNNER_TEMP/tv-build.log"
            echo "::endgroup::"
            exit "$result"
          fi

      - name: Verify and stage APK
        id: verify_apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -type f -name '*.apk' -print | grep -i 'universal' | head -n 1 || true)"
          if [ -z "$APK" ]; then
            echo "::error::Build finished but the expected Universal APK was not found"
            find app/build/outputs -maxdepth 6 -type f 2>/dev/null || true
            exit 1
          fi
          mkdir -p publish
          cp "$APK" publish/NetMirror-Music-Android-TV-Universal-FOSS-Debug.apk
          test -s publish/NetMirror-Music-Android-TV-Universal-FOSS-Debug.apk
          sha256sum publish/NetMirror-Music-Android-TV-Universal-FOSS-Debug.apk
          ls -lh publish/

      - name: Upload verified TV APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetMirror-Android-TV-APK
          path: publish/NetMirror-Music-Android-TV-Universal-FOSS-Debug.apk
          if-no-files-found: error
          retention-days: 30
