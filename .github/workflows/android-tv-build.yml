name: NetMirror Music Android TV APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "core/**"
      - "playback/**"
      - "audio-dsp/**"
      - "dsp-core/**"
      - "usbaudio/**"
      - "innertube/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradlew"
      - ".github/workflows/android-tv-build.yml"

permissions:
  contents: read

concurrency:
  group: netmirror-tv-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-tv-apk:
    name: Build and verify Android TV ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager was not found in the preinstalled runner SDK"
            find "$SDK_ROOT" -maxdepth 4 -name sdkmanager -type f -print || true
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-37" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Validate project and prepare debug signing
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f gradle/wrapper/gradle-wrapper.jar
          grep -q 'android.intent.category.LEANBACK_LAUNCHER' app/src/main/AndroidManifest.xml || {
            echo "::error::Android TV Leanback launcher category is missing from the manifest"
            exit 1
          }
          chmod +x gradlew
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          ./gradlew --no-daemon --version

      - name: Align compile SDK for current dependency metadata
        shell: bash
        run: |
          set -euo pipefail
          # This adjustment is limited to the temporary CI checkout.
          if grep -Eq 'compileSdk[[:space:]]*=[[:space:]]*36' app/build.gradle.kts; then
            sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*36/compileSdk = 37/' app/build.gradle.kts
          fi
          grep -q 'compileSdk = 37' app/build.gradle.kts || {
            echo "::error::Could not set app compileSdk to 37"
            exit 1
          }

      - name: Build FOSS ARM64 debug APK and capture diagnostics
        shell: bash
        run: |
          set -uo pipefail
          set +e
          ./gradlew --no-daemon --max-workers=2 --console=plain --stacktrace --warning-mode all :app:assembleFossArm64Debug 2>&1 | tee "$RUNNER_TEMP/tv-build.log"
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ]; then
            echo "::group::Likely build errors"
            grep -n -E -i 'What went wrong|Execution failed for task|^e: | error:|Could not resolve|Could not find|Unresolved reference|Compilation error|requires libraries|Caused by:|BUILD FAILED' "$RUNNER_TEMP/tv-build.log" | tail -n 120 || true
            echo "::endgroup::"
            echo "::group::Last 180 build log lines"
            tail -n 180 "$RUNNER_TEMP/tv-build.log"
            echo "::endgroup::"
            exit "$result"
          fi

      - name: Verify and stage Android TV APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -type f -name '*.apk' -print | grep -i 'arm64' | grep -i 'foss' | grep -i 'debug' | head -n 1 || true)"
          if [ -z "$APK" ]; then
            echo "::error::Build completed but the FOSS ARM64 Debug APK was not found"
            find app/build/outputs -maxdepth 7 -type f 2>/dev/null || true
            exit 1
          fi
          mkdir -p publish
          cp "$APK" publish/Net-Mirror-Music-android-tv-ARM64-debug.apk
          test -s publish/Net-Mirror-Music-android-tv-ARM64-debug.apk
          echo "APK SHA-256:"
          sha256sum publish/Net-Mirror-Music-android-tv-ARM64-debug.apk
          echo "APK file size:"
          ls -lh publish/

      - name: Upload verified Android TV APK
        uses: actions/upload-artifact@v4
        with:
          name: NetMirror-Music-android-tv-ARM64-debug
          path: publish/Net-Mirror-Music-android-tv-ARM64-debug.apk
          if-no-files-found: error
          retention-days: 30
