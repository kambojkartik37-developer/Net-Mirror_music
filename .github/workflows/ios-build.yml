name: iOS Build

on:
  push:
    branches:
      - main
      - "ios/**"
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS app (Simulator)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/NetMirrorIOS
        run: xcodegen generate

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/NetMirrorIOS/NetMirrorIOS.xcodeproj \
            -scheme NetMirrorIOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-derived \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build/ios-build.log

      - name: Upload simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NetMirrorIOS-Simulator-${{ github.sha }}
          path: build/ios-derived/Build/Products/Debug-iphonesimulator/NetMirrorIOS.app
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log-${{ github.sha }}
          path: build/ios-build.log
          if-no-files-found: ignore
          retention-days: 7
