name: NetMirror Music Android Phone APK - Clean Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk-clean.yml'
      - '.github/workflows/publish-release.yml'
      - '**/*.kt'
      - '**/*.java'
      - '**/*.cpp'
      - '**/*.c'
      - '**/*.h'
      - '**/CMakeLists.txt'
      - '**/*.xml'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - '**/*.toml'
      - '**/*.proto'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradle/wrapper/**'

permissions:
  contents: read

concurrency:
  group: netmirror-music-android-phone-clean-apk
  cancel-in-progress: false

jobs:
  build:
    name: Build Universal FOSS Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "ndk;28.2.13676358"

      - name: Create CI debug signing keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          test -s "$HOME/.android/debug.keystore"

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f gradlew
          chmod +x ./gradlew
          java -version
          ./gradlew --version

      - name: Build APK
        shell: bash
        run: |
          ./gradlew --no-daemon --stacktrace --no-configuration-cache \
            -x :app:checkUniversalFossDebugAarMetadata \
            :app:assembleUniversalFossDebug

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-apks
          find app/build/outputs/apk -type f -name '*.apk' -print
          APK="$(find app/build/outputs/apk -type f -name '*universal*foss*debug*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            APK="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          fi
          test -n "$APK"
          test -s "$APK"
          cp "$APK" build-apks/NetMirror-Music-Universal-FOSS-Debug.apk
          ls -lh build-apks/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NetMirror-Music-Android-Phone-APK
          path: build-apks/NetMirror-Music-Universal-FOSS-Debug.apk
          if-no-files-found: error
          retention-days: 14
