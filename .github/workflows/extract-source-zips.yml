name: Extract NetMirror source ZIPs

on:
  push:
    branches: [main]
    paths:
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extract-netmirror-source
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract source archives if present
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, zipfile, shutil

          root = pathlib.Path.cwd()
          archives = sorted(p for p in root.glob("*.zip") if p.is_file())
          if not archives:
              required = ["settings.gradle.kts", "gradlew", "app/build.gradle.kts"]
              missing = [p for p in required if not (root / p).is_file()]
              if missing:
                  raise SystemExit("No source ZIPs found and source project is incomplete: " + ", ".join(missing))
              print("Source ZIPs have already been extracted. Nothing to do; verification passed.")
              raise SystemExit(0)

          if len(archives) < 2:
              raise SystemExit("Please upload both source ZIP files to the repository root before running extraction.")

          staging = root / ".source-extract-staging"
          if staging.exists():
              shutil.rmtree(staging)
          staging.mkdir()

          count = 0
          try:
              for archive in archives:
                  print("Extracting:", archive.name)
                  with zipfile.ZipFile(archive) as zf:
                      for item in zf.infolist():
                          name = item.filename
                          if not name or name.endswith("/") or name.startswith("__MACOSX/"):
                              continue
                          parts = pathlib.PurePosixPath(name).parts
                          if not parts or parts[0] == ".github" or pathlib.PurePosixPath(name).is_absolute() or ".." in parts:
                              continue
                          target = (staging / pathlib.Path(*parts)).resolve()
                          if staging.resolve() not in target.parents:
                              raise RuntimeError("Unsafe ZIP path: " + name)
                          target.parent.mkdir(parents=True, exist_ok=True)
                          with zf.open(item) as src, target.open("wb") as dst:
                              shutil.copyfileobj(src, dst)
                          count += 1

              if count == 0:
                  raise RuntimeError("No files found in source ZIPs.")

              for src in staging.rglob("*"):
                  if not src.is_file():
                      continue
                  rel = src.relative_to(staging)
                  dst = root / rel
                  if dst.exists() and dst.is_dir():
                      raise RuntimeError("File/directory conflict: " + str(rel))
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dst)

              for archive in archives:
                  archive.unlink()
              print(f"Successfully extracted {count} files from {len(archives)} ZIPs.")
          finally:
              if staging.exists():
                  shutil.rmtree(staging)
          PY

      - name: Commit extracted source files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit; source is already extracted."
          else
            git commit -m "Extract NetMirror Music source ZIPs"
            git push
          fi
