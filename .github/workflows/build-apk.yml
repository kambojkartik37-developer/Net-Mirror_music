name: Build NetMirror Music APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.kt'
      - '**/*.java'
      - '**/*.xml'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - '**/*.toml'
      - '**/*.proto'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradle/wrapper/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: netmirror-apk-build
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # GitHub's Ubuntu runner already includes Android command-line tools.
      # Avoid android-actions/setup-android here: its setup step may call
      # the retired "tools" SDK package and fail before Gradle starts.
      - name: Configure Android SDK tools
        shell: bash
        run: |
          set -e
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || {
            echo "Android SDK command-line tools were not found at $ANDROID_HOME"
            find /usr/local/lib/android/sdk/cmdline-tools -maxdepth 3 -name sdkmanager -type f 2>/dev/null || true
            exit 1
          }
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Install required Android SDK packages
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" \
            "platforms;android-36" \
            "ndk;28.2.13676358"

      - name: Verify source and Gradle wrapper
        shell: bash
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f gradlew
          chmod +x ./gradlew
          java -version
          ./gradlew --version

      - name: Build universal FOSS debug APK
        run: ./gradlew --no-daemon --stacktrace --no-configuration-cache :app:assembleUniversalFossDebug

      - name: Locate and validate APK
        shell: bash
        run: |
          set -e
          mkdir -p build-apks
          mapfile -t apks < <(find app/build/outputs/apk -type f -name '*.apk' 2>/dev/null | sort)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "Build completed but no APK was found."
            exit 1
          fi
          for apk in "${apks[@]}"; do
            cp "$apk" "build-apks/$(basename "$apk")"
          done
          find build-apks -maxdepth 1 -type f -name '*.apk' -exec ls -lh {} \;

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetMirror-Music-APK
          path: build-apks/*.apk
          if-no-files-found: error
          retention-days: 14
