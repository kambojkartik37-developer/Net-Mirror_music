name: Extract README ZIP to repository root

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-readme-zip.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract README and images
        shell: bash
        run: |
          set -euo pipefail
          ZIP="NetMirror-Music-README-with-3-images.zip"
          test -f "$ZIP" || { echo "ZIP not found: $ZIP"; exit 1; }
          mkdir -p "$RUNNER_TEMP/readme-zip"
          unzip -o "$ZIP" -d "$RUNNER_TEMP/readme-zip"
          echo "ZIP contents:"
          find "$RUNNER_TEMP/readme-zip" -type f -maxdepth 5 -print
          README_FILE="$(find "$RUNNER_TEMP/readme-zip" -type f \( -iname 'README.md' -o -iname 'readme.md' \) | head -n 1)"
          test -n "$README_FILE" || { echo "README.md was not found inside ZIP"; exit 1; }
          cp "$README_FILE" README.md
          mkdir -p README-images
          while IFS= read -r -d '' file; do
            case "${file,,}" in
              *.png|*.jpg|*.jpeg|*.webp|*.gif|*.svg)
                cp "$file" "README-images/$(basename "$file")"
                ;;
            esac
          done < <(find "$RUNNER_TEMP/readme-zip" -type f -print0)
          echo "Extracted README.md and image assets:"
          ls -lah README.md README-images || true

      - name: Commit extracted README and images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README-images
          if git diff --cached --quiet; then
            echo "No README or image changes to commit."
            exit 0
          fi
          git commit -m "Extract README and three images from uploaded ZIP"
          git push
