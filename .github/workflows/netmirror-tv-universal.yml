name: Android TV Build (Universal FOSS)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle*'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'
      - '.github/workflows/netmirror-tv-universal.yml'

permissions:
  contents: read

concurrency:
  group: android-tv-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify universal FOSS APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Show available Android build tasks
        run: ./gradlew tasks --all

      - name: Build universal FOSS debug APK
        run: ./gradlew --no-daemon --stacktrace --warning-mode all assembleUniversalFossDebug

      - name: Verify APK exists and is non-empty
        shell: bash
        run: |
          set -euo pipefail
          find app/build/outputs/apk -type f -name '*.apk' -size +0c -print
          test "$(find app/build/outputs/apk -type f -name '*.apk' -size +0c | wc -l)" -gt 0

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-tv-universal-foss-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
